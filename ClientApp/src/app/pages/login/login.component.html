<div class="login-container">
  <button mat-button
          color="accent"
          (click)="goBack()">
    ← Vissza
  </button>

  <mat-card class="max-w-sm mx-auto p-6">
    <h2 mat-card-title>Admin bejelentkezés</h2>
    <mat-card-content>
      <form #loginForm="ngForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="fill" class="w-full mb-4">
          <mat-label>Felhasználónév</mat-label>
          <input matInput
            name="username"
            [(ngModel)]="username"
            #usernameCtrl="ngModel"
            required>
          <mat-error *ngIf="usernameCtrl.invalid && usernameCtrl.touched">
            Felhasználónév kötelező
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="fill" class="w-full mb-4">
          <mat-label>Jelszó</mat-label>
          <input matInput
            type="password"
            name="password"
            [(ngModel)]="password"
            #passwordCtrl="ngModel"
            required>
          <mat-error *ngIf="passwordCtrl.invalid && passwordCtrl.touched">
            Jelszó kötelező
          </mat-error>
        </mat-form-field>

        <div class="flex justify-end">
          <button mat-raised-button
                  color="primary"
                  [disabled]="loginForm.invalid">
            Bejelentkezés
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
