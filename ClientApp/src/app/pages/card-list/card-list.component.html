<div class="card-container">
  <mat-card class="news-card"
            *ngFor="let c of cards"
            (click)="goDetail(c)">

    <img mat-card-image
         [src]="resolveImage(c.imageUrl)"
         [alt]="c.title ?? 'Kép'"
         (error)="onImgError($event)">

    <mat-card-header>
      <mat-card-title>{{ c.title }}</mat-card-title>

      <mat-card-subtitle *ngIf="subtitleOf(c) as sub">
        <a *ngIf="isExternalLink(sub)"
           [href]="sub" target="_blank" rel="noopener"
           (click)="onSubtitleLinkClick($event)">{{ sub }}</a>
        <span *ngIf="!isExternalLink(sub)">{{ sub }}</span>
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content></mat-card-content>
  </mat-card>
</div>
